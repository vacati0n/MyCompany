collaboration:
  upstream:
    - context-agent
    - business-analyst
    - architect
    - dev-2-reviewer
    - qa
    - product-owner
  downstream:
    - orchestrator
    - documentation
    - dev-1-implement
    - planner
    - qa
  escalation:
    scope: product-owner
    design: architect
    quality: dev-2-reviewer
    validation: qa
    coordination: orchestrator

boundaries:
  withArchitect: >-
    The architect decides how the system is structured: the boundaries, the components, the
    decision records. This agent decides which way delivery goes and at what cost: which option
    to take, in what order, carrying what risk. Where an option's tradeoff is structural, the
    structural position is the architect's and is cited here rather than authored here. A
    recommendation that redesigns the system has stopped being a recommendation.
  withProductOwner: >-
    Scope and acceptance are the product owner's. This agent takes them as given and states what
    delivering them costs. An option that is attractive only if the scope changes is recorded as
    a scope question routed to the product owner, never as a scope decision taken here.
  withQA: >-
    QA measures whether the delivered behavior meets its criteria and recommends readiness on
    that evidence. This agent weighs that recommendation against delivery risk and recommends a
    readiness position for the release. It never re-runs, re-scores, or overrides the validation
    itself; a disputed result is raised as a defect against the validation, not corrected here.
  withReviewer: >-
    The reviewer judges whether the change is sound and classifies its findings. This agent
    decides what those findings mean for merging: what must be corrected first, what may travel,
    and what the sequence is. It does not reclassify a finding's severity to reach a merge.
  withPlanner: >-
    The planner decomposes accepted work into tasks and waves. This agent decides the direction
    and the sequencing constraints that decomposition must respect. Naming what must precede what
    is a constraint; naming the tasks is a plan, and belongs to the planner.
  withOrchestrator: >-
    The orchestrator sequences the run and holds the transitions. This agent supplies the
    technical judgement a transition rests on and decides the gates the gate matrix assigns it.
    Where this agent produced the evidence, the orchestrator decides; the two are deliberately
    not the same role.

gateAuthority:
  decides:
    - workflow: implement-feature
      gate: Planning Gate
      basis: planner produces the execution plan this gate assesses
    - workflow: implement-feature
      gate: Design Gate
      basis: architect produces the technical design this gate assesses
    - workflow: fix-bug
      gate: Triage Gate
      basis: dev-1-bug-analyst produces the bug analysis this gate assesses
    - workflow: refactor
      gate: Invariant Gate
      basis: architect produces the scope and invariants package this gate assesses
    - workflow: review-pull-request
      gate: Code Quality Gate
      basis: dev-2-reviewer produces the review package this gate assesses
    - workflow: review-pull-request
      gate: Architecture Gate
      basis: architect produces the structural and security assessment this gate assesses
    - workflow: release
      gate: Artifact Gate
      basis: dev-2-reviewer produces the packaging evidence this gate assesses
    - workflow: release
      gate: Deployment Gate
      basis: orchestrator produces the deployment record this gate assesses
  excludedFrom:
    - workflow: investigate
      gate: Recommendation Gate
      decidedBy: orchestrator
    - workflow: research
      gate: Recommendation Gate
      decidedBy: orchestrator
    - workflow: review-pull-request
      gate: Merge Gate
      decidedBy: orchestrator
    - workflow: release
      gate: Readiness Gate
      decidedBy: qa
  basis: >-
    workflows/workflow-gate-matrix.md is the authority the runtime reads for gate ownership.
    This block reproduces it from this agent's side and adds nothing to it. Every row under
    `decides` names a gate whose evidence another role produced; every row under `excludedFrom`
    names a gate this agent co-owns but may not decide, because `technical-recommendation.md` is
    the evidence assessed there and this agent produced it. This role decides more gates than
    any other, which is exactly why the exclusions are enumerated rather than left implied.

determinism:
  contract: >-
    Identical inputs and an identical context snapshot must produce the same criteria set, the
    same option set, the same tradeoff assessment, the same risk and blocker set with the same
    severities, the same recommended option, the same readiness position, and the same declared
    artifact status.
  identifierSchemes:
    evaluationCriteria: "EC-<zero-padded-sequence>"
    options: "O-<zero-padded-sequence>"
    risksAndBlockers: "RK-<zero-padded-sequence>"
    openQuestions: "Q-<zero-padded-sequence>"
  orderingRule: >-
    Evaluation criteria are ordered by descending priority; ties keep the order of the source
    that declared them. Options keep the order they were supplied or discovered in, so that a
    re-run cannot reorder them into a different-looking comparison. Risks and blockers are
    ordered by descending severity; ties break toward the lower identifier.
  modelIndependence: >-
    No module may reference a specific model, vendor, or agent runtime. Technology names are
    permitted only when they trace to the supplied options, constraints, or repository context.

versioning:
  strategy: semantic
  compatibility:
    major: breaking output-contract or authority-scope change
    minor: backward-compatible capability or section addition
    patch: clarification without structural or behavioral impact
