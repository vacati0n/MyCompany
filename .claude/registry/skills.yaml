      operational clarity, covering explicit dependencies and object lifetimes,
      cancellation-aware asynchronous flows, versioned contracts, and boundary validation
      that fails fast with context.
    version: 1.0.0
    status: active
    specificationPath: skills/dotnet/engineering-playbook.md
    dependencies: []
    tags:
      - dotnet
      - dependency-injection
      - async
      - contracts
    owner: Architecture
    capabilities:
