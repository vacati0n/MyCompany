retiredAssets:
  - assetPath: skills/cicd/release-automation.md
    displayName: Release Automation
    status: retired
    retiredInRegistryVersion: 1.3.0
    retirementDate: "2026-08-19"
    reason: >-
      Holds no canonical skill identifier and satisfies neither the skill contract in
      skills/skill-governance.md, which requires Principles, Anti-patterns, Decision Rules,
      and Common Mistakes, nor the approved category taxonomy, which has no CI/CD value. Its
      guidance is already carried by the resolvable surface: release tagging discipline by
      S10, test-pass thresholds and reporting by S07, and the pipeline gates themselves by
      quality-gates.md, which is gate authority rather than skill guidance. No agent manifest
      and no phase of any active workflow references it, so retirement removes no capability
      from any resolved skill bundle.
    replacement:
      - S10
      - S07
    runtimeResolvable: false

  - assetPath: skills/coding-style/dotnet-coding-style.md
    displayName: .NET Coding Style
    status: retired
    retiredInRegistryVersion: 1.3.0
    retirementDate: "2026-08-19"
    reason: >-
      Holds no canonical skill identifier and satisfies neither the skill contract in
      skills/skill-governance.md nor the approved category taxonomy, which has no Coding Style
      value. Its standards restate S03 .NET Engineering -- intent-carrying names, explicit
      side effects, cancellation tokens through async flows, and logging with context -- which
      is the duplicate-skill-intent conflict named in skills/skill-resolver.md, resolved here
      in favour of the registered skill. No agent manifest and no phase of any active workflow
      references it, so retirement removes no capability from any resolved skill bundle.
    replacement:
      - S03
    runtimeResolvable: false
