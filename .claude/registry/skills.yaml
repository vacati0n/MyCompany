apiVersion: framework.registry/v1
kind: RegistrySpecification
registryType: skills
metadata:
  displayName: Skill Registry
  description: >-
    Discovery index specification for reusable skill definitions. Records supply the
    identity metadata that skill files do not carry (skill code, category, version,
    status); the skill file referenced by specificationPath remains the sole source of
    skill behavior. `records` is the runtime-resolvable surface and carries active skills
    only; `retiredAssets` is the governance record of skill files that exist on disk and
    are excluded from resolution.
  version: 1.3.0
  status: active
  owner: Architecture

recordSchema:
  identifier:
    type: string
    required: true
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    description: >-
      Registry key. Derived mechanically from the specificationPath basename without its
      extension, so the key is verifiable against the skill file it indexes.
  skillCode:
    type: string
    required: true
    pattern: "^S[0-9]{2}$"
    description: >-
      Canonical skill identifier as published in the Skill Catalog of
      skills/agent-skill-matrix.md and referenced by agent manifests. Preserved across
      non-breaking updates per domain-model/skill-specification.md.
  displayName:
    type: string
    required: true
    description: Skill name exactly as declared by the skill file heading.
  category:
    type: string
    required: true
    allowedValues:
      - Architecture
      - Business
      - .NET
      - Avalonia
      - React
      - Database
      - Testing
      - Performance
      - Security
      - Git
      - Logging
      - Error Handling
    description: >-
      Approved skill taxonomy as published in the Skill Catalog of
      skills/agent-skill-matrix.md. Extending the taxonomy is a registry schema change.
  description:
    type: string
    required: true
  version:
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  status:
    type: string
    required: true
    allowedValues: [draft, active, deprecated, retired]
  specificationPath:
    type: string
    required: true
    description: >-
      Repository-relative path to the authoritative skill definition file. Agent
      manifest skill references resolve through this field.
  dependencies:
    type: array
    required: true
    itemSchema:
      identifier: string
      versionConstraint: string
      dependencyType: string
  tags:
    type: array
    required: true
    itemType: string
  owner:
    type: string
    required: true
  capabilities:
    type: array
    required: true
    itemType: string

retirementSchema:
  description: >-
    Field set for `retiredAssets`. A retirement record indexes a skill file that exists on
    disk and is excluded from active mapping per the Retired lifecycle state in
    domain-model/skill-specification.md. It carries no skillCode, because a retired asset
    holds no canonical skill identifier that an agent manifest or a workflow phase may cite.
  assetPath:
    type: string
    required: true
    description: Repository-relative path to the retired skill file.
  displayName:
    type: string
    required: true
    description: Skill name exactly as declared by the retired skill file heading.
  status:
    type: string
    required: true
    allowedValues: [deprecated, retired]
  retiredInRegistryVersion:
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  retirementDate:
    type: string
    required: true
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  reason:
    type: string
    required: true
    description: Why the asset is excluded from the runtime-resolvable surface.
  replacement:
    type: array
    required: true
    itemType: string
    description: >-
      Skill codes that carry the retired guidance forward. Required and non-empty: skill
      governance in skills/skill-governance.md admits no deprecation without a replacement
      reference.
  runtimeResolvable:
    type: boolean
    required: true
    allowedValues: [false]

automation:
  uniqueKey: identifier
  alternateKey: skillCode
  indexing:
    - identifier
    - skillCode
    - category
    - status
    - tags
    - owner
  compatibility:
    compareBy: semanticVersion
  resolution:
    agentReferenceKey: skillCode
    description: >-
      Agent manifests declare skill dependencies by skillCode with a relative ref to the
      skill file. A reference resolves when exactly one record matches the skillCode and
      that record's specificationPath denotes the same file as the declared ref.
    failOnUnresolvedAgentReference: true
  retirement:
    resolvable: false
    description: >-
      `retiredAssets` is governance history, not a resolution surface. The resolver reads
      `records` only, so a retired asset can never enter a resolved skill bundle. A retired
      asset re-enters the resolvable surface only as a new `records` entry, which requires the
      asset to satisfy the skill contract in skills/skill-governance.md and its category to
      exist in the approved taxonomy above.
  validation:
    failOnUnknownFields: true
    requireAllFields: true
    enforceDependencyResolution: true
    enforceUniqueAlternateKey: true
    enforceSpecificationPathExists: true
    enforceRetiredAssetsAbsentFromRecords: true
    enforceRetirementReplacementResolves: true

records:
  - identifier: clean-architecture-checklist
    skillCode: S01
    displayName: Architecture Foundations
    category: Architecture
    description: >-
      Reusable architecture guidance for designing maintainable, modular, and scalable
      systems, covering dependency direction, explicit boundaries, adapter isolation,
      and the threshold for recording an architecture decision.
    version: 1.1.0
    status: active
    specificationPath: skills/architecture/clean-architecture-checklist.md
    dependencies: []
    tags:
      - architecture
      - boundaries
      - modularity
      - decision-records
    owner: Architecture
    capabilities:
      - layer-boundary-assessment
      - dependency-direction-analysis
      - adapter-isolation-guidance
      - architecture-decision-triggers

  - identifier: domain-modeling
    skillCode: S02
    displayName: Business Analysis and Domain Modeling
    category: Business
    description: >-
      Practices for building shared business understanding and robust domain models,
      covering bounded contexts, enforceable invariants, explicit state transitions, and
      requirement-to-validation traceability.
    version: 1.0.0
    status: active
    specificationPath: skills/business/domain-modeling.md
    dependencies: []
